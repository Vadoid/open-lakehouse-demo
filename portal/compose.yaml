services:
  portal:
    image: node:22-alpine
    container_name: open-lakehouse-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:80"
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./index.html:/app/index.html:ro
      - ./server.mjs:/app/server.mjs:ro
    networks:
      - lakedemo

networks:
  lakedemo:
    name: lakedemo
    external: true
